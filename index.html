<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PT 304 Interactive Quiz</title><style>body{font:16px system-ui,Arial;background:#eef3fa;color:#172b46;margin:0}.card{max-width:720px;margin:28px auto;background:white;padding:28px;border-radius:20px;box-shadow:0 5px 25px #b5c3d5}h1{color:#194cb1}button{cursor:pointer;font:inherit}.opt{display:block;width:100%;text-align:left;padding:14px;border:2px solid #dce5f2;border-radius:12px;background:white;margin:9px 0}.sel{background:#dceaff;border-color:#2462d5}.primary{padding:13px 22px;background:#245bd2;color:white;border:0;border-radius:10px;margin:8px}.primary:disabled{opacity:.4}.review{border-bottom:1px solid #ddd;padding:12px 0}.good{color:#117f3c}.bad{color:#b12b30}.muted{color:#66788e}input{padding:12px;border:1px solid #aaa;border-radius:8px}@media(max-width:600px){.card{margin:8px;padding:17px}}</style><main class="card" id="app"></main><script>const bank=[["Which system is official in USP–NF?","Avoirdupois|Apothecaries|Metric|Household",2],["One avoirdupois pound equals:","16 oz and 7000 grains|16 oz and 6000 grains|12 oz and 5000 grains|14 oz and 6800 grains",0],["The Roman numeral XC represents:","60|90|100|40",1],["1 gram equals how many milligrams?","100|1000|10000|10",1],["1 liter equals how many milliliters?","100|1000|10000|10",1],["Which prefix represents one millionth?","Milli|Centi|Micro|Kilo",2],["How many grains are in one apothecaries scruple?","3|8|20|60",2],["In the lecture, one teaspoonful is equivalent to:","2 mL|5 mL|8 mL|15 mL",1],["How many Roman numeral units are in XXIV?","14|19|24|26",2],["A pharmaceutical solution is best defined as:","Suspension of solid particles in a liquid|Homogeneous mixture of solute dissolved in solvent|Emulsion of two immiscible liquids|Semi-solid dosage form",1],["Which is NOT an advantage of pharmaceutical solutions?","Rapid onset|Enhanced bioavailability|Greater stability than solids|Homogeneous dosage delivery",2],["A main disadvantage of pharmaceutical solutions is:","Slow onset|Risk of leakage and stability concerns|Difficult administration|Low patient compliance",1],["Buffers are mainly added to solutions to:","Increase viscosity|Resist pH changes|Improve taste|Act as preservatives",1],["Which is an isotonicity modifier?","Glycerin|0.9% NaCl|Ascorbic acid|Benzalkonium chloride",1],["Which antioxidant is fat-soluble?","Ascorbic acid|Sodium metabisulfite|Tocopherol|EDTA",2],["Aromatic waters are mainly prepared by:","Distillation or solution process|Filtration and evaporation|Autoclaving|Adsorption",0],["Elixirs differ from syrups because elixirs:","Are opaque and viscous|Contain alcohol as co-solvent|Do not require sweeteners|Cannot be taken orally",1],["Which is a non-aqueous solvent?","Distilled water|Ethanol|Purified water|Sterile water for injection",1],["The USP sterility test ensures:","No precipitation|No microbial growth after incubation|Isotonicity|Correct viscosity",1],["Which water purification method uses cation and anion resins?","Distillation|Ion exchange|UV irradiation|Percolation",1],["Which method forces water through a semipermeable membrane under pressure?","Reverse osmosis|Distillation|Percolation|Simple filtration",0],["What is a stated limitation of ion exchange?","Always requires boiling|Does not remove bacteria or pyrogens|Requires alcohol|Cannot remove ions",1],["Which water treatment uses ultraviolet light?","EDI|UV treatment|Distillation|Ion exchange",1],["What is the role of EDTA in solutions?","Sweetener|Chelating agent for trace metals|Solvent|Colorant",1],["Which is a common viscosity enhancer?","Hydroxypropyl methylcellulose|Sucrose only|Sodium chloride only|Citric acid only",0],["Which preservative is listed as incompatible with many anionic compounds?","Parabens|Benzalkonium chloride|Sorbic acid|Ethanol",1],["Simple Syrup USP contains approximately:","20% sucrose|40% sucrose|66.7% sucrose|95% sucrose",2],["Which syrup preparation method avoids heat for heat-labile substances?","Agitation|Boiling|Dry heat|Autoclaving",0],["In invert syrup, sucrose is hydrolyzed to:","Lactose and maltose|Glucose and fructose|Glucose and galactose|Sorbitol and glycerin",1],["What alcohol concentration range is listed for elixirs?","0–1%|3–40%|50–90%|80–100%",1],["Gargles are generally:","Swallowed directly|Held in the throat without swallowing|Injected|Applied to the eye",1],["An aqueous enema may contain:","Phosphate salts|Only ethanol|Only mineral oil|No active components",0],["Which route is used for nasal solutions?","Rectal|Nasal|Intravenous only|Ophthalmic only",1],["Which of the following is an example of a fixed oil?","Ethanol|Sesame oil|Purified water|Propylene glycol",1],["Why may sugar-free syrups require preservatives?","They contain no water|They lack the high sugar self-preservation effect|They are always sterile|They contain no flavors",1]].map(([q,o,a])=>({q,o:o.split('|'),a}));let i=0,answers={},name='';const app=document.getElementById('app');function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}function intro(){app.innerHTML='<h1>Pharmaceutical Dosage Forms I</h1><p>PT 304 · 35 multiple-choice questions · Automatic grading</p><p class="muted">Based on uploaded lecture pages 1–50. Answers appear after submission.</p><p>Student name (optional): <input id="student"></p><button class="primary" onclick="start()">Start Quiz →</button>'}function start(){name=document.getElementById('student').value.trim();i=0;answers={};show()}function show(){let x=bank[i];app.innerHTML='<p class="muted">PT 304 · Question '+(i+1)+' of '+bank.length+'</p><progress value="'+(i+1)+'" max="'+bank.length+'" style="width:100%"></progress><h2>'+esc(x.q)+'</h2>'+x.o.map((v,j)=>'<button class="opt '+(answers[i]===j?'sel':'')+'" onclick="pick('+j+')"><b>'+('ABCD'[j])+'.</b> '+esc(v)+'</button>').join('')+'<button class="primary" '+(i===0?'disabled':'')+' onclick="i--;show()">Previous</button><button class="primary" '+(answers[i]===undefined?'disabled':'')+' onclick="'+(i===bank.length-1?'finish()':'i++;show()')+'">'+(i===bank.length-1?'Submit Quiz':'Next →')+'</button>'}function pick(j){answers[i]=j;show()}function finish(){let n=bank.filter((x,j)=>x.a===answers[j]).length;app.innerHTML='<h1>Quiz completed</h1><h2>'+esc(name?name+': ':'')+n+'/'+bank.length+' ('+Math.round(100*n/bank.length)+'%)</h2><button class="primary" onclick="intro()">Try again</button><button class="primary" onclick="window.print()">Print results</button>'+bank.map((x,j)=>'<div class="review"><b>'+(j+1)+'. '+esc(x.q)+'</b><p class="'+(answers[j]===x.a?'good':'bad')+'">'+(answers[j]===x.a?'✓ Correct':'✗ Incorrect')+' · Your answer: '+esc(x.o[answers[j]])+'</p><p><b>Correct answer:</b> '+esc(x.o[x.a])+'</p></div>').join('')}intro();</script></html>
